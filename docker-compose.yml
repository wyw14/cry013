services:
  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: /data/cry013.db
      JWT_SECRET: local-compose-secret-change-before-production
    volumes:
      - app_data:/data
    ports: ["8080:8080"]
volumes:
  app_data:
